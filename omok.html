<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe6"><title>오목 한 판</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;600;700&display=swap');
:root{--bg:#f4efe6;--paper:#fffdf8;--ink:#292820;--muted:#888477;--line:#e7dfd1;--gold:#d9b77f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,sans-serif}.app{width:min(100% - 28px,520px);margin:auto;padding:24px 0 35px}.top{display:flex;justify-content:space-between;color:#9b7650;font-size:11px;letter-spacing:.16em;margin-bottom:25px}.pill{border:1px solid var(--line);border-radius:30px;padding:7px 10px;color:var(--muted);letter-spacing:0}h1{text-align:center;font:400 40px 'Gowun Batang',serif;margin:0}.sub{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 24px}.status{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}.muted{color:var(--muted);font-size:11px;font-weight:400}.board-wrap{padding:13px;background:linear-gradient(135deg,#e4c99c,#d4b17a);border-radius:18px;border:1px solid #c5a16c;box-shadow:0 12px 30px #6b4d241c}canvas{width:100%;height:auto;display:block;aspect-ratio:1;touch-action:manipulation}.note{text-align:center;color:#806743;font-size:10px;letter-spacing:.1em;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}button,select{font:inherit;cursor:pointer}.actions button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 8px;font-size:13px;font-weight:700;color:var(--ink)}.actions .primary{background:var(--ink);color:white;border-color:var(--ink)}.settings{text-align:center;margin-top:15px;color:var(--muted);font-size:12px}select{margin-left:7px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}.help{margin-top:17px;padding:14px 16px;border-radius:13px;background:#eee7da;color:#777062;font-size:12px;line-height:1.7}.overlay{display:none;position:fixed;inset:0;background:#24221dcc;align-items:center;justify-content:center;padding:24px}.overlay.show{display:flex}.modal{background:var(--paper);border-radius:18px;padding:26px 22px;text-align:center;width:min(100%,340px)}.modal h2{font:28px 'Gowun Batang',serif}.modal p{font-size:13px;color:var(--muted);line-height:1.7}.modal button{width:100%;border:0;border-radius:11px;padding:14px;background:var(--ink);color:white;font-weight:700}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);opacity:0;background:#292820;color:white;border-radius:30px;padding:12px 18px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><main class="app"><div class="top"><b>A LITTLE GAME</b><span class="pill">1 PLAYER MODE</span></div><h1>오목 한 판</h1><p class="sub">잠깐의 여유, 다섯 알의 승부</p><div class="status"><span id="turn">● 내 차례예요</span><span class="muted" id="count">0수 진행</span></div><div class="board-wrap"><canvas id="board" width="750" height="750" aria-label="15줄 오목판"></canvas><div class="note">YOUR TURN · BLACK FIRST</div></div><div class="actions"><button id="undo">↶ 한 수 무르기</button><button class="primary" id="reset">새 게임 시작</button></div><div class="settings">컴퓨터 난이도 <select id="level"><option value="easy">가볍게</option><option value="normal" selected>보통</option><option value="hard">어렵게</option></select></div><div class="help"><b>게임 방법</b><br>검은 돌이 먼저 시작해요. 빈 교차점을 눌러 돌을 놓고, 가로·세로·대각선 중 한 방향으로 먼저 다섯 알을 연결하면 승리해요.</div></main><div class="overlay" id="overlay"><div class="modal"><h2 id="result">승리했어요!</h2><p id="desc">멋진 한 수였어요.</p><button id="again">다시 한 판</button></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const n=15,cv=document.querySelector('#board'),ctx=cv.getContext('2d'),pad=42,step=(750-84)/14,$=id=>document.getElementById(id);let b,ms,done,busy,last,timer;
function init(){b=Array.from({length:n},()=>Array(n).fill(0));ms=[];done=busy=false;last=null;$('overlay').classList.remove('show');status();draw()}
function status(){$('count').textContent=ms.length+'수 진행';$('turn').textContent=done?'대국이 끝났어요':busy?'○ 컴퓨터가 생각 중이에요':'● 내 차례예요'}
function draw(){ctx.clearRect(0,0,750,750);ctx.fillStyle='#d9b77f';ctx.fillRect(0,0,750,750);ctx.strokeStyle='#76552e';ctx.lineWidth=1.5;for(let i=0;i<n;i++){let p=pad+i*step;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(708,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,708);ctx.stroke()}[3,7,11].forEach(r=>[3,7,11].forEach(c=>{ctx.beginPath();ctx.arc(pad+c*step,pad+r*step,4,0,7);ctx.fillStyle='#76552e';ctx.fill()}));for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(b[r][c]){let x=pad+c*step,y=pad+r*step,g=ctx.createRadialGradient(x-8,y-9,2,x,y,step*.44);if(b[r][c]===1){g.addColorStop(0,'#777');g.addColorStop(.4,'#333');g.addColorStop(1,'#101010')}else{g.addColorStop(0,'#fff');g.addColorStop(.7,'#f4f0e7');g.addColorStop(1,'#c9c1b3')}ctx.beginPath();ctx.arc(x,y,step*.43,0,7);ctx.fillStyle=g;ctx.fill();if(last&&last.r===r&&last.c===c){ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fillStyle=b[r][c]===1?'#f1e6cf':'#76664e';ctx.fill()}}}
function win(r,c,col){return [[1,0],[0,1],[1,1],[1,-1]].some(([dr,dc])=>{let k=1;for(let s of [-1,1])for(let i=1;i<5;i++){let y=r+s*dr*i,x=c+s*dc*i;if(y<0||y>=n||x<0||x>=n||b[y][x]!==col)break;k++}return k>=5})}
function end(col){done=true;busy=false;status();$('result').textContent=col===1?'승리했어요!':col===2?'컴퓨터 승리':'무승부';$('desc').textContent=col===1?'멋진 한 수였어요. 오늘의 오목 챔피언은 바로 당신!':'아쉽지만 괜찮아요. 한 판 더 도전해 볼까요?';setTimeout(()=>$('overlay').classList.add('show'),250)}
function put(r,c,col){if(b[r][c]||done)return;b[r][c]=col;ms.push({r,c,col});last={r,c};draw();status();if(win(r,c,col)){end(col);return}if(ms.length===225){end(0)}}
function score(r,c,col){let total=0;for(let[dr,dc]of [[1,0],[0,1],[1,1],[1,-1]]){let k=1,open=0;for(let s of [-1,1]){let y=r+s*dr,x=c+s*dc;while(y>=0&&y<n&&x>=0&&x<n&&b[y][x]===col){k++;y+=s*dr;x+=s*dc}if(y>=0&&y<n&&x>=0&&x<n&&!b[y][x])open++}total+=({1:2,2:12,3:90,4:1800,5:100000}[Math.min(k,5)]||0)*(open===2?1.2:open===1?1:.15)}return total}
function ai(){if(done)return;let set=new Set();if(!ms.length)set.add('7,7');else ms.forEach(m=>{for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){let r=m.r+dr,c=m.c+dc;if(r>=0&&r<n&&c>=0&&c<n&&!b[r][c])set.add(r+','+c)}});let best=null,bs=-1;for(let s of set){let[r,c]=s.split(',').map(Number);b[r][c]=2;let a=score(r,c,2);b[r][c]=1;let d=score(r,c,1);b[r][c]=0;let lv=$('level').value,v=a*1.05+d*(lv==='easy'?.75:lv==='normal'?1.02:1.18)+Math.random()*(lv==='hard'?3:lv==='easy'?90:35);if(v>bs){bs=v;best={r,c}}}if(best)put(best.r,best.c,2)}
cv.addEventListener('pointerdown',e=>{if(done||busy)return;let rect=cv.getBoundingClientRect(),scale=750/rect.width,x=(e.clientX-rect.left)*scale,y=(e.clientY-rect.top)*scale,c=Math.round((x-pad)/step),r=Math.round((y-pad)/step);if(r<0||r>=n||c<0||c>=n||Math.hypot(x-pad-c*step,y-pad-r*step)>step*.48||b[r][c])return;put(r,c,1);if(!done){busy=true;status();timer=setTimeout(()=>{busy=false;ai()},350)}});
$('undo').onclick=()=>{if(busy||done||!ms.length){toast('무를 수 있는 수가 없어요.');return}for(let i=0;i<Math.min(2,ms.length);i++){let m=ms.pop();b[m.r][m.c]=0}last=ms.at(-1)||null;draw();status();toast('한 수 되돌렸어요.')};
$('reset').onclick=()=>{clearTimeout(timer);init();toast('새 게임을 시작해요.')};$('again').onclick=()=>{clearTimeout(timer);init()};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),1600)}init()})();
</script></body></html>
