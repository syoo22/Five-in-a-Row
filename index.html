<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>오목 한 판</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600;700;800&display=swap');
:root{--bg:#f3eee4;--paper:#fffdf8;--ink:#292820;--muted:#888477;--line:#e7dfd1;--accent:#8b6742;--wood:#d8b77f;--wood-dark:#a97d49;--black:#262522;--white:#fffdf5}
*{box-sizing:border-box}
html{background:#f3eee4}
body{margin:0;background:#f3eee4;background:var(--bg);color:var(--ink);font-family:Pretendard,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
.app{width:min(100% - 28px,520px);margin:0 auto;padding:22px 0 34px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{font:800 13px Pretendard,sans-serif;letter-spacing:.045em;color:#49331f;text-transform:none}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:7px 11px;border-radius:30px;background:#ffffff80}
h1{font:400 clamp(30px,8vw,42px) 'Gowun Batang',serif;text-align:center;margin:0}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:9px 0 24px}
.status-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px 17px;margin-bottom:14px;box-shadow:0 5px 20px #55452a0a}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.turn{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.stone{width:24px;height:24px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset -3px -4px 5px #0002,0 2px 4px #0002}
.stone.black{background:radial-gradient(circle at 32% 27%,#666 0,#292929 45%,#111 100%)}
.stone.white{background:radial-gradient(circle at 32% 27%,#fff 0,#f4f0e7 55%,#d8d1c4 100%);border:1px solid #d5cdbf}
.score{font-size:11px;color:var(--muted)}
.board-wrap{background:linear-gradient(145deg,#ecd4a9 0%,#d9b77f 38%,#c99f66 100%);padding:13px;border-radius:19px;box-shadow:0 14px 34px #5d40251f,inset 0 2px 3px #fff9,inset 0 -4px 8px #80552c35;border:1px solid #b98d57;position:relative;overflow:hidden}.board-wrap:before{content:'';position:absolute;inset:4px;border:1px solid #fff5;border-radius:15px;pointer-events:none}
canvas{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:manipulation;border-radius:7px}
.board-note{text-align:center;color:#76532f;font-size:10px;letter-spacing:.08em;margin:11px 0 1px}.coach{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px;box-shadow:0 5px 18px #55452a08}.coach-avatar{width:52px;height:52px;border:0;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#f8e8ca,#d7b17c);font-size:29px;box-shadow:inset 0 2px 4px #fff9,0 3px 8px #76532f20;transition:transform .22s;cursor:pointer}.coach-avatar:active{transform:scale(.88) rotate(-8deg)}.coach-avatar.bounce{animation:toriBounce .55s ease}.coach-avatar.win{animation:toriCelebrate .9s ease infinite alternate}@keyframes toriBounce{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-8px) rotate(-9deg)}70%{transform:translateY(1px) rotate(7deg)}}@keyframes toriCelebrate{from{transform:translateY(0) rotate(-8deg) scale(1)}to{transform:translateY(-9px) rotate(8deg) scale(1.08)}}.coach-name{font-size:11px;font-weight:800;color:var(--accent);margin-bottom:4px}.coach-message{font-size:12px;color:#625b4f;line-height:1.5}.win-line{animation:winPulse .75s ease-in-out infinite alternate}@keyframes winPulse{from{opacity:.55}to{opacity:1;filter:drop-shadow(0 0 8px #fff4a8)}}
.record-card{margin-top:14px;padding:15px 16px;background:linear-gradient(145deg,#fffdf9,#f4ead9);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px #55452a0a}.record-title{font-size:12px;font-weight:800;color:#806044;margin-bottom:12px;letter-spacing:.04em}.record-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.record-num{font:700 21px 'Gowun Batang',serif;color:#49331f}.record-label{font-size:10px;color:var(--muted);margin-top:3px}.sound-toggle{margin:12px auto 0;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fffdf8;border-radius:30px;padding:8px 13px;color:#766047;font-size:11px}.sound-toggle[aria-pressed=true]{background:#eee2cf;color:#49331f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.action{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:13px;padding:14px 10px;font-size:13px;font-weight:700;transition:.15s}
.action:active{transform:scale(.98)}
.action.primary{background:var(--ink);color:#fffdf7;border-color:var(--ink)}
.settings{display:flex;justify-content:center;align-items:center;gap:9px;margin:15px 0 0;color:var(--muted);font-size:12px}
select{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit}
.help{margin-top:18px;background:#eee7da;border-radius:14px;padding:14px 16px;color:#777062;font-size:12px;line-height:1.7}
.help b{color:#514b40}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#292820;color:#fffdf7;border-radius:30px;padding:12px 18px;font-size:13px;white-space:nowrap;transition:.25s;box-shadow:0 6px 20px #0002;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:#24221dcc;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.overlay.show{display:flex}
.modal{width:min(100%,340px);background:var(--paper);border-radius:20px;padding:27px 22px;text-align:center;box-shadow:0 20px 60px #0004;animation:modalPop .48s cubic-bezier(.2,.85,.25,1.25)}@keyframes modalPop{0%{opacity:0;transform:translateY(18px) scale(.88)}70%{transform:translateY(-4px) scale(1.025)}100%{opacity:1;transform:translateY(0) scale(1)}}.overlay.show:before,.overlay.show:after{content:'✦  ✧  ✦';position:absolute;color:#f5dcae;font-size:25px;letter-spacing:22px;animation:twinkle 1.2s ease-in-out infinite alternate;pointer-events:none}.overlay.show:before{top:18%;left:8%}.overlay.show:after{bottom:18%;right:5%}@keyframes twinkle{from{opacity:.25;transform:scale(.8) rotate(-8deg)}to{opacity:1;transform:scale(1.15) rotate(8deg)}}
.modal .big{font:400 28px 'Gowun Batang',serif;margin:0 0 9px}
.modal p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 20px}
.modal button{width:100%;border:0;border-radius:12px;padding:14px;background:var(--ink);color:white;font-weight:700}
@media(min-width:600px){.app{padding-top:34px}.board-wrap{padding:17px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">Five-in-a-Row</div><div class="pill">1 PLAYER MODE</div></div>
  <h1>오목 한 판</h1>
  <p class="sub">잠깐의 여유, 다섯 알의 승부</p>
  <section class="status-card"><div class="status-row"><div class="turn" id="turnLabel"><span class="stone black"></span><span>내 차례예요</span></div><div class="score" id="moveCount">0수 진행</div></div></section>
  <div class="board-wrap"><canvas id="board" width="750" height="750" aria-label="15줄 오목판"></canvas><div class="board-note">YOUR TURN · BLACK FIRST</div></div>
  <section class="coach" aria-live="polite"><div class="coach-avatar" id="coachAvatar">🦉</div><div><div class="coach-name">오목 친구 토리</div><div class="coach-message" id="coachMessage">안녕! 오늘은 내가 상대해 줄게. 첫 수를 놓아봐!</div></div></section>
  <section class="record-card"><div class="record-title">TORI MATCH RECORDS</div><div class="record-grid"><div><div class="record-num" id="winsPlayer">0</div><div class="record-label">내 승리</div></div><div><div class="record-num" id="winsTori">0</div><div class="record-label">토리 승리</div></div><div><div class="record-num" id="draws">0</div><div class="record-label">무승부</div></div><div><div class="record-num" id="totalGames">0</div><div class="record-label">총 대국</div></div></div><button class="sound-toggle" id="soundToggle" aria-pressed="true">🔊 착수 소리 켜짐</button></section>
  <div class="actions"><button class="action" id="undoBtn">↶ 한 수 무르기</button><button class="action primary" id="restartBtn">새 게임 시작</button></div>
  <div class="settings"><label for="level">컴퓨터 난이도</label><select id="level"><option value="easy">가볍게</option><option value="normal" selected>보통</option><option value="hard">어렵게</option></select></div>
  <div class="help"><b>게임 방법</b><br>검은 돌이 먼저 시작해요. 빈 교차점을 눌러 돌을 놓고, 가로·세로·대각선 중 한 방향으로 먼저 다섯 알을 연결하면 승리해요.</div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal"><div class="big" id="resultTitle">승리!</div><p id="resultText">멋진 한 수였어요.</p><button id="againBtn">다시 한 판</button></div></div>
<script>
(() => {
 const N=15, canvas=document.getElementById('board'), ctx=canvas.getContext('2d');
 const pad=42, step=(canvas.width-pad*2)/(N-1);
 let board, moves, over=false, thinking=false, last=null, animating=null, winLine=[];
 let soundOn=true,audioCtx=null,stats=loadStats(),resultSaved=false;
 function loadStats(){try{return Object.assign({player:0,tori:0,draw:0},JSON.parse(localStorage.getItem('toriOmokStats')||'{}'))}catch(e){return {player:0,tori:0,draw:0}}}
 function saveStats(){try{localStorage.setItem('toriOmokStats',JSON.stringify(stats))}catch(e){}renderStats()}
 function renderStats(){$('winsPlayer').textContent=stats.player;$('winsTori').textContent=stats.tori;$('draws').textContent=stats.draw;$('totalGames').textContent=stats.player+stats.tori+stats.draw}
 function playStoneSound(color){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(color===1?185:225,t);o.frequency.exponentialRampToValueAtTime(82,t+.075);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.13)}catch(e){}}
 function avatarMood(emoji,celebrate=false){const a=$('coachAvatar');a.textContent='🦉';a.classList.remove('bounce','win');void a.offsetWidth;a.classList.add(celebrate?'win':'bounce')}
 const $=id=>document.getElementById(id);
 function init(){board=Array.from({length:N},()=>Array(N).fill(0));moves=[];resultSaved=false;over=false;thinking=false;last=null;animating=null;winLine=[];$('overlay').classList.remove('show');$('coachAvatar').textContent='🦉';$('coachMessage').textContent='안녕! 오늘은 내가 상대해 줄게. 첫 수를 놓아봐!';updateStatus();draw();}
 function draw(){
   const w=canvas.width;ctx.clearRect(0,0,w,w);
   const wood=ctx.createLinearGradient(0,0,w,w);wood.addColorStop(0,'#e6c895');wood.addColorStop(.48,'#d8b77f');wood.addColorStop(1,'#c99d63');ctx.fillStyle=wood;ctx.fillRect(0,0,w,w);
   for(let i=0;i<34;i++){const y=(i*29+13)%w;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(w*.28,y-7,w*.68,y+8,w,y-3);ctx.strokeStyle=i%3===0?'rgba(255,245,220,.13)':'rgba(112,73,34,.055)';ctx.lineWidth=i%4===0?2:1;ctx.stroke();}
   ctx.strokeStyle='rgba(91,65,31,.72)';ctx.lineWidth=1.6;
   for(let i=0;i<N;i++){const p=pad+i*step;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(w-pad,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,w-pad);ctx.stroke();}
   [3,7,11].forEach(r=>[3,7,11].forEach(c=>{ctx.beginPath();ctx.arc(pad+c*step,pad+r*step,4.3,0,Math.PI*2);ctx.fillStyle='#76552e';ctx.fill();}));
   for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c])stone(r,c,board[r][c],last&&last.r===r&&last.c===c);
   if(winLine.length){const a=winLine[0],b=winLine[winLine.length-1];ctx.save();ctx.beginPath();ctx.moveTo(pad+a.c*step,pad+a.r*step);ctx.lineTo(pad+b.c*step,pad+b.r*step);ctx.strokeStyle='rgba(255,246,180,.95)';ctx.lineWidth=step*.13;ctx.lineCap='round';ctx.shadowColor='#fff2a8';ctx.shadowBlur=18;ctx.stroke();ctx.restore();}
 }
 function stone(r,c,color,isLast){
   const x=pad+c*step,y=pad+r*step,baseRad=step*.43;let scale=1;
   if(animating&&animating.r===r&&animating.c===c){const t=Math.min(1,(performance.now()-animating.start)/190);scale=.18+(1-Math.pow(1-t,3))*.82;}
   const rad=baseRad*scale;const g=ctx.createRadialGradient(x-rad*.32,y-rad*.36,rad*.08,x,y,rad*1.2);
   if(color===1){g.addColorStop(0,'#777');g.addColorStop(.35,'#333');g.addColorStop(1,'#101010')}else{g.addColorStop(0,'#fff');g.addColorStop(.7,'#f4f0e7');g.addColorStop(1,'#c9c1b3')}
   ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=color===1?'#171717':'#c8c0b2';ctx.lineWidth=1.3;ctx.stroke();
   if(isLast){ctx.beginPath();ctx.arc(x,y,4.2,0,Math.PI*2);ctx.fillStyle=color===1?'#f1e6cf':'#76664e';ctx.fill();}
   if(animating&&animating.r===r&&animating.c===c&&performance.now()-animating.start<190){requestAnimationFrame(()=>draw());}
 }
 function updateStatus(){$('moveCount').textContent=moves.length+'수 진행';const label=$('turnLabel');if(over){label.innerHTML='<span>'+(moves.length&&moves[moves.length-1].color===2?'토리가 이겼어요! 🦉':moves.length&&moves[moves.length-1].color===1?'네가 이겼어요! 🎉':'비겼어요! 🤝')+'</span>';return}if(thinking){label.innerHTML='<span class="stone white"></span><span>토리가 다음 수를 고민하고 있어요...</span>'}else label.innerHTML='<span class="stone black"></span><span>내 차례예요</span>';}
 function place(r,c,color){if(board[r][c]||over)return false;playStoneSound(color);board[r][c]=color;moves.push({r,c,color});last={r,c};animating={r,c,start:performance.now()};draw();updateStatus();requestAnimationFrame(function tick(){if(!animating)return;if(performance.now()-animating.start>=210){animating=null;draw();return}draw();requestAnimationFrame(tick)});if(color===1)react('player');if(checkWin(r,c,color)){finish(color);return true}if(moves.length===N*N){finish(0);return true}return true;}
 function checkWin(r,c,color){const dirs=[[1,0],[0,1],[1,1],[1,-1]];for(const [dr,dc] of dirs){const line=[{r,c}];for(const sign of [-1,1])for(let k=1;k<5;k++){const y=r+dr*k*sign,x=c+dc*k*sign;if(y<0||y>=N||x<0||x>=N||board[y][x]!==color)break;if(sign===-1)line.unshift({r:y,c:x});else line.push({r:y,c:x});}if(line.length>=5){winLine=line.slice(0,5);draw();return true}}return false;}
 function react(type){const messages={player:['오, 좋은 자리인데? 나도 집중해야겠어!','흠… 그쪽으로 이어가려는 거지?','좋은 수야! 하지만 아직 승부는 몰라.'],ai:['여기는 내가 먼저 차지할게!','이 수는 어때? 다음 수를 생각해 봐!','조금 고민했어. 이제 네 차례야!'],near:['앗, 오목이 될 뻔했어!','위험했어! 다음엔 더 조심해야겠다.']};const list=messages[type]||messages.player;$('coachMessage').textContent=list[Math.floor(Math.random()*list.length)];avatarMood(type==='near'?'😳':type==='ai'?'😏':'🦉');}
 function finish(color){over=true;thinking=false;if(!resultSaved){if(color===1)stats.player++;else if(color===2)stats.tori++;else stats.draw++;saveStats();resultSaved=true;}updateStatus();$('resultTitle').textContent=color===1?'승리했어요!':color===2?'토리의 승리! 🦉':'무승부! 🤝';$('coachMessage').textContent=color===1?'와아! 완벽한 오목이야. 오늘은 네가 이겼어!':color===2?'후후! 이번 판은 토리가 이겼다! 🦉 다음엔 꼭 이겨봐!':'정말 팽팽한 승부였어! 다음 판도 같이 하자!';avatarMood(color===1?'🥳':color===2?'🦉':'🤝',color!==0);$('resultText').textContent=color===1?'멋진 한 수였어요. 오늘의 오목 챔피언은 바로 당신!':color===2?'토리의 승리! 🦉 후후, 한 판 더 하면 결과가 달라질지도 몰라!':'빈틈없는 승부였어요. 토리와 한 판 더 해볼까요?';setTimeout(()=>$('overlay').classList.add('show'),280);}
 function evaluate(r,c,color){const dirs=[[1,0],[0,1],[1,1],[1,-1]];let total=0;for(const [dr,dc] of dirs){let count=1,open=0;for(const sign of [-1,1]){let y=r+dr*sign,x=c+dc*sign;while(y>=0&&y<N&&x>=0&&x<N&&board[y][x]===color){count++;y+=dr*sign;x+=dc*sign}if(y>=0&&y<N&&x>=0&&x<N&&board[y][x]===0)open++;}const scores={1:2,2:12,3:90,4:1800,5:100000};total+=(scores[Math.min(count,5)]||0)*(open===2?1.2:open===1?1:.15);}return total;}
 function candidates(){const set=new Set();if(moves.length===0)return [{r:7,c:7}];for(const m of moves)for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const r=m.r+dr,c=m.c+dc;if(r>=0&&r<N&&c>=0&&c<N&&!board[r][c])set.add(r+','+c);}return [...set].map(s=>{const [r,c]=s.split(',').map(Number);return {r,c}});}
 function aiMove(){if(over)return;const level=$('level').value,list=candidates();let best=null,bestScore=-Infinity;for(const p of list){board[p.r][p.c]=2;const attack=evaluate(p.r,p.c,2);board[p.r][p.c]=1;const defense=evaluate(p.r,p.c,1);board[p.r][p.c]=0;let score=attack*1.05+defense*(level==='easy'?.75:level==='normal'?1.02:1.18)+Math.random()*(level==='hard'?3:35);if(level==='easy')score=attack*.85+defense*.7+Math.random()*90;if(score>bestScore){bestScore=score;best=p;}}if(best){board[best.r][best.c]=2;const winsNow=checkWin(best.r,best.c,2);board[best.r][best.c]=0;react('ai');place(best.r,best.c,2);}}
 function onTap(e){if(over||thinking)return;const rect=canvas.getBoundingClientRect(),scale=canvas.width/rect.width;const x=(e.clientX-rect.left)*scale,y=(e.clientY-rect.top)*scale;const c=Math.round((x-pad)/step),r=Math.round((y-pad)/step);if(r<0||r>=N||c<0||c>=N)return;const px=pad+c*step,py=pad+r*step;if(Math.hypot(x-px,y-py)>step*.48||board[r][c])return;place(r,c,1);if(!over){if(evaluate(r,c,1)>=1800)react('near');thinking=true;updateStatus();setTimeout(()=>{thinking=false;aiMove()},850);}}
 canvas.addEventListener('pointerdown',onTap);
 $('coachAvatar').setAttribute('role','button');$('coachAvatar').setAttribute('tabindex','0');$('coachAvatar').setAttribute('aria-label','토리에게 말 걸기');
 function talkToTori(){const lines=['왜 불렀어? 나 작전 짜는 중이야!','이번 판은 자신 있다구!','쉿, 다음 수를 읽고 있어...','간식 먹고 싶지만 대국부터 하자!','나 꽤 똑똑한 부엉이라구!'];$('coachMessage').textContent=lines[Math.floor(Math.random()*lines.length)];avatarMood(['🦉','😉','🤔','😋'][Math.floor(Math.random()*4)]);}
 $('coachAvatar').addEventListener('click',talkToTori);$('coachAvatar').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();talkToTori()}});
 $('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;$('soundToggle').setAttribute('aria-pressed',String(soundOn));$('soundToggle').textContent=soundOn?'🔊 착수 소리 켜짐':'🔇 착수 소리 꺼짐';if(soundOn)playStoneSound(1)});
 $('undoBtn').addEventListener('click',()=>{if(thinking||moves.length<1||over){toast('무를 수 있는 수가 없어요.');return}const count=moves.length>=2?2:1;for(let i=0;i<count;i++){const m=moves.pop();board[m.r][m.c]=0}last=moves.length?moves[moves.length-1]:null;winLine=[];draw();updateStatus();$('coachMessage').textContent='괜찮아, 다시 생각해 보자!';$('coachAvatar').textContent='🦉';toast('한 수 되돌렸어요.');});
 $('restartBtn').addEventListener('click',()=>{init();toast('새 게임을 시작해요.')});$('againBtn').addEventListener('click',init);
 let toastTimer;function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
 renderStats();init();
})();
